# =====================================================================
# nginx : serveur du frontend + reverse proxy vers l'API
#
# Consequence pedagogique importante : le navigateur ne parle QU'A
# nginx (http://localhost:8080). Les appels /api/... sont relayes vers
# le conteneur « api ». Meme origine => aucun probleme de CORS.
#
# Le port 3010 reste tout de meme publie sur l'hote : c'est la porte
# d'entree pour Postman / curl, quand on veut tester l'API sans passer
# par le navigateur.
# =====================================================================

server {
    listen      8080;
    server_name localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # --- Fichiers statiques du frontend ------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # --- Relais vers l'API REST --------------------------------------
    # Pas de barre oblique finale apres 3010 : l'URI complete
    # (/api/etudiants) est transmise telle quelle a Node.
    #
    # Le « ^~ » n'est pas decoratif : sans lui, une route comme
    # /api/config.js serait captee par le bloc « location ~* \.(js|...) »
    # plus bas (les blocs regex passent avant les blocs prefixe) et
    # nginx chercherait un fichier au lieu d'appeler l'API.
    location ^~ /api/ {
        proxy_pass http://api:3010;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Messages d'erreur utiles quand l'API est arretee
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # --- Pas de cache sur les sources en developpement ---------------
    # Sans ca, l'etudiant modifie son .js et le navigateur sert
    # l'ancienne version : source de frustration classique.
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
    }
}
