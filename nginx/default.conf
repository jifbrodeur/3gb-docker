# =====================================================================
# nginx : serveur du frontend + reverse proxy vers l'API
#
# Consequence pedagogique importante : le navigateur ne parle QU'A
# nginx (http://localhost:8080). Les appels /api/... sont relayes vers
# le conteneur « api ». Meme origine => aucun probleme de CORS.
#
# Le port 3010 reste tout de meme publie sur l'hote : c'est la porte
# d'entree pour Postman / curl, quand on veut tester l'API sans passer
# par le navigateur.
# =====================================================================

server {
    listen      8080;
    server_name localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # --- Fichiers statiques du frontend ------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # --- Resolution DNS dynamique ------------------------------------
    # 127.0.0.11 est le DNS interne de Docker. Sans cette ligne, nginx
    # resout « api » UNE SEULE FOIS, au demarrage, et garde l'adresse IP.
    # Apres un rebuild de l'API, le conteneur peut changer d'IP : nginx
    # frapperait l'ancienne adresse et repondrait 502 Bad Gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Relais vers l'API REST --------------------------------------
    # La variable force nginx a re-resoudre « api » via le resolver
    # ci-dessus. Pas d'URI apres le port : l'URI complete
    # (/api/etudiants) est transmise telle quelle a Node.
    #
    # Le « ^~ » n'est pas decoratif : sans lui, une route comme
    # /api/config.js serait captee par le bloc « location ~* \.(js|...) »
    # plus bas (les blocs regex passent avant les blocs prefixe) et
    # nginx chercherait un fichier au lieu d'appeler l'API.
    location ^~ /api/ {
        set $api_amont http://api:3010;
        proxy_pass $api_amont;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Messages d'erreur utiles quand l'API est arretee
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # Quand NGINX ne peut pas joindre Node (502) ou que Node ne
        # repond pas a temps (504), on renvoie du JSON:API au lieu de la
        # page HTML par defaut. Les erreurs produites par Node lui-meme
        # (400, 404, 500...) ne sont pas touchees.
        error_page 502 = @api_injoignable;
        error_page 504 = @api_trop_lente;
    }

    location @api_injoignable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 502 '{"errors":[{"status":"502","title":"API injoignable","detail":"nginx fonctionne, mais l\'API Node n\'ecoute pas sur le port 3010 (demarrage en cours, erreur au lancement ou module manquant). Consultez : docker compose logs --tail 40 api","code":"-502","meta":{"timestamp":"$time_iso8601"}}]}';
    }

    location @api_trop_lente {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 504 '{"errors":[{"status":"504","title":"API trop lente","detail":"L\'API Node n\'a pas repondu en 30 secondes (requete Oracle bloquee ?). Consultez : docker compose logs --tail 40 api","code":"-504","meta":{"timestamp":"$time_iso8601"}}]}';
    }

    # --- Pas de cache sur les sources en developpement ---------------
    # Sans ca, l'etudiant modifie son .js et le navigateur sert
    # l'ancienne version : source de frustration classique.
    location ~* \.(js|css|html)$ {
        # Une seule directive : « expires -1 » ajouterait un 2e en-tete
        # Cache-Control (no-cache) a cote de celui-ci.
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
