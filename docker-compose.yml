# =====================================================================
# Cours 3GB - API REST : environnement de laboratoire (3 conteneurs)
#
#   oracle-db  Oracle Database 23ai Free   -> port hote 1521
#   api        Node.js + node-oracledb     -> port hote 3010
#   web        nginx (statique + proxy)    -> port hote 8080
#
# Demarrage : docker compose up -d --watch   (ou --watch sans -d pour
#             voir les logs ; Ctrl-C arrete la synchro, pas la base)
# Arret     : docker compose down          (les donnees Oracle survivent)
# Remise a zero complete : docker compose down -v
# =====================================================================

name: cours-3gb

services:

  # -------------------------------------------------------------------
  # 1. Base de donnees Oracle
  # -------------------------------------------------------------------
  oracle-db:
    # Version epinglee. Une base ne fonctionne qu'avec la version d'image
    # qui l'a creee : chaque image ne contient qu'UN fichier de fuseaux
    # horaires (23.26.2 -> v45, 23.26.3-slim -> v43). Ouvrir une base avec
    # une autre version donne ORA-01804. Les bases creees en 23.26.2
    # mettent donc ORACLE_TAG=23.26.2-slim dans leur .env.
    image: gvenzl/oracle-free:${ORACLE_TAG:-23.26.3-slim}
    container_name: 3gb-oracle
    restart: unless-stopped
    environment:
      # Mot de passe des comptes SYS et SYSTEM (obligatoire)
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
    ports:
      # Publie pour SQL Developer / DBeaver sur le poste de l'etudiant.
      # 127.0.0.1 : accessible depuis CE poste seulement, pas depuis le
      # reseau du college (tous les .env ont le meme mot de passe SYSTEM).
      - "127.0.0.1:${ORACLE_PORT:-1521}:1521"
    volumes:
      # Persistance des fichiers de la base
      - oracle-data:/opt/oracle/oradata
      # Scripts joues UNE SEULE FOIS, a la toute premiere creation de la base
      - ./oracle/init:/container-entrypoint-initdb.d:ro
      # Scripts applicatifs joues MANUELLEMENT par la suite (voir README)
      - ./oracle/app:/sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      # Oracle prend 1 a 3 minutes au tout premier demarrage : on ne
      # declare pas le conteneur malade pendant cette periode.
      start_period: 180s
    networks:
      - 3gb-net

  # -------------------------------------------------------------------
  # 2. API REST Node.js
  # -------------------------------------------------------------------
  api:
    build: ./backend
    container_name: 3gb-api
    restart: unless-stopped
    # Petit processus init (tini) en PID 1 : il relaie SIGTERM a Node lors
    # d'un « docker compose down » ; l'arret propre (fermeture du pool)
    # a lieu au lieu d'un SIGKILL apres 10 secondes.
    init: true
    environment:
      NODE_ENV: development
      PORT: 3010
      # Vu du reseau Docker : le nom du service, PAS localhost.
      DB_CONNECT_STRING: oracle-db:1521/FREEPDB1
      DB_USER: ${APP_USER}
      DB_PASSWORD: ${APP_USER_PASSWORD}
    ports:
      # Publie pour que Postman / curl frappent l'API directement
      - "127.0.0.1:${API_PORT:-3010}:3010"
    volumes:
      # Journaux winston (logs/serveur.log) visibles sur le poste :
      # backend/logs/ s'ouvre dans VS Code, Notepad ou TextEdit.
      - ./backend/logs:/app/logs
    # Synchronisation du code : « docker compose up --watch ».
    # Pas de volume monte sur ./backend/src : sur Windows (WSL 2), une
    # sauvegarde dans VS Code ne produit aucun evenement de fichier dans
    # le conteneur et node --watch ne redemarrait jamais. Ici, Compose
    # surveille le poste et COPIE le fichier dans le conteneur ; la copie
    # se fait dans Linux, node --watch la voit et redemarre.
    develop:
      watch:
        # Code source : copie fichier par fichier, sans rebuild
        - action: sync
          path: ./backend/src
          target: /app/src
          # Au lancement, recopie tout src/ : les changements faits
          # pendant que watch ne tournait pas ne sont pas perdus.
          initial_sync: true
        # Nouvelle dependance : l'image est reconstruite (npm ci)
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/package-lock.json
    depends_on:
      oracle-db:
        # L'API ne demarre pas avant qu'Oracle reponde au healthcheck
        condition: service_healthy
    networks:
      - 3gb-net

  # -------------------------------------------------------------------
  # 3. Serveur web nginx
  # -------------------------------------------------------------------
  web:
    image: nginx:1.30.6-alpine
    container_name: 3gb-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    volumes:
      # Volume partage frontend : HTML / CSS / JS servis tels quels,
      # aucun rebuild, un simple rafraichissement du navigateur suffit.
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - 3gb-net

volumes:
  oracle-data:

networks:
  3gb-net:
    driver: bridge
